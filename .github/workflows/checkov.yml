name: Checkov IaC Scan

on:
  pull_request:
    paths:
      - '**/*.tf'
      - '**/*.hcl'

jobs:
  checkov:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .  # Escanea todo el repo
