name: Checkov IaC Scan

on:
  pull_request:
    branches: [ "develop", "main" ]
    paths:
      - "**/*.tf"
      - "**/*.hcl"

jobs:
  checkov:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Checkov with severity output
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          output_format: cli
          quiet: false
          soft_fail: false
